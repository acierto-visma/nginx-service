services:
  nginx-proxy:
    image: nginx:latest
    container_name: nginx-proxy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "80:80"
    depends_on:
      - index
      - social
    restart: always
    networks:
      - app_network
  index:
    build:
      context: ./nginx/index
      dockerfile: index.dockerfile
    container_name: index
    restart: always
    networks:
      - app_network
  social:
    build:
      context: ./nginx/social
      dockerfile: social.dockerfile
    container_name: social
    restart: always
    networks:
      - app_network
networks:
  app_network: