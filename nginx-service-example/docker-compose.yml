services:
  nginx-proxy:
    image: nginx:latest
    container_name: nginx-proxy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - performance
      - social
    restart: always
    ports:
      - "1170:80"
    networks:
      - app_network
  performance:
    build:
      context: ./nginx/performance
      dockerfile: performance.dockerfile
    container_name: performance
    restart: always
    networks:
      - app_network
  social:
    build:
      context: ./nginx/social
      dockerfile: social.dockerfile
    container_name: social
    restart: always
    networks:
      - app_network
networks:
  app_network: